<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" aria-label="Illustrative analytical summary — HR Attrition Analysis project architecture and metrics visualization">
  <defs>
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F8F5"/>
      <stop offset="100%" style="stop-color:#F1F2EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-main)"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#1F6B50">HR Attrition Analysis — Illustrative Summary</text>
  <text x="400" y="72" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#536158">Predictive modeling using IBM HR dataset (1,470 records, 35 features, 16% attrition)</text>

  <!-- Three evidence panels -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="110" y="28" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#17211B">Key Metrics</text>
    <text x="110" y="55" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">Verified project benchmarks</text>
    <!-- Metric lines -->
    <text x="20" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B">ROC-AUC: 0.91</text>
    <text x="20" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B">Precision@10%: 0.78</text>
    <text x="20" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#D99A3D">$2.3M (project-level estimate)</text>
  </g>

  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="110" y="28" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#17211B">Approach</text>
    <text x="110" y="55" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">Domain-driven feature engineering + SHAP</text>
    <text x="20" y="80" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">47 engineered features</text>
    <text x="20" y="100" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">XGBoost with Optuna tuning</text>
    <text x="20" y="120" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">SHAP explainability for HR stakeholders</text>
  </g>

  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="110" y="28" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#17211B">Limitations</text>
    <text x="110" y="55" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">Not a validated client outcome</text>
    <text x="20" y="80" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">IBM public dataset; results reflect benchmark conditions.</text>
    <text x="20" y="100" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">No causal inference claimed; SHAP shows association.</text>
    <text x="20" y="120" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Fairness audit required before real deployment.</text>
  </g>

  <!-- Pipeline flow -->
  <text x="400" y="280" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#1F6B50">Pipeline: Raw HR Data → Feature Engineering → XGBoost → SHAP → Business Recommendations</text>

  <!-- Bottom note -->
  <rect x="50" y="300" width="700" height="80" rx="8" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
  <text x="400" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#536158">This is an illustrative analytical summary. It represents verified project structure and metrics from the repository. It is not a screenshot of a live production system.</text>
  <text x="400" y="345" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8D9A94">All metrics come from verified repository data: IBM dataset (1,470 records, 35 features), ROC-AUC 0.91, Precision@Top 10% 0.78, estimated savings $2.3M.</text>
  <text x="400" y="365" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#A8C3AE">Case study: /portfolio/projects/hr-attrition-analysis</text>
</svg>
