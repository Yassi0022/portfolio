<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" aria-label="Illustrative system overview — HobbyBuddy social matching platform architecture and benchmarks">
  <defs>
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F8F5"/>
      <stop offset="100%" style="stop-color:#F1F2EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-main)"/>

  <text x="400" y="48" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#1F6B50">HobbyBuddy — Illustrative System Overview</text>
  <text x="400" y="72" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#536158">Full-stack social matching platform with personality-based recommendations and real-time chat</text>

  <!-- Three system layers -->
  <g transform="translate(100, 120)">
    <rect width="180" height="80" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="90" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#17211B">Frontend</text>
    <text x="90" y="46" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">React + TypeScript</text>
    <text x="90" y="62" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Responsive UI, WebSocket chat</text>
  </g>

  <g transform="translate(320, 120)">
    <rect width="180" height="80" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="90" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#17211B">Backend</text>
    <text x="90" y="46" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Spring Boot + Java</text>
    <text x="90" y="62" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">REST API, JWT auth, matching algorithm</text>
  </g>

  <g transform="translate(540, 120)">
    <rect width="180" height="80" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="90" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#17211B">Data Layer</text>
    <text x="90" y="46" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">MySQL + Redis</text>
    <text x="90" y="62" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">User profiles, interest graphs</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(100, 240)">
    <rect width="160" height="90" rx="10" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
    <text x="80" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#17211B">API Performance</text>
    <text x="80" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#17211B" font-weight="600">87ms p95</text>
    <text x="80" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Spring Boot with connection pooling</text>
  </g>

  <g transform="translate(300, 240)">
    <rect width="160" height="90" rx="10" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
    <text x="80" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#17211B">Reliability</text>
    <text x="80" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#17211B" font-weight="600">99.9% uptime</text>
    <text x="80" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Kubernetes health checks</text>
  </g>

  <g transform="translate(500, 240)">
    <rect width="160" height="90" rx="10" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
    <text x="80" y="26" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#17211B">Matching Scale</text>
    <text x="80" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#17211B" font-weight="600">O(n log n)</text>
    <text x="80" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Optimized for 10k+ users</text>
  </g>

  <!-- Note -->
  <rect x="100" y="370" width="600" height="50" rx="8" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
  <text x="400" y="390" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8D9A94">Illustrative system overview — not a live demo screenshot. Metrics reflect verified project-level benchmarks.</text>
  <text x="400" y="405" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#A8C3AE">Case study: /portfolio/projects/hobbybuddy</text>
</svg>
