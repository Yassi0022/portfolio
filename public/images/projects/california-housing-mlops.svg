<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" aria-label="Illustrative architecture summary — California Housing MLOps pipeline stages">
  <defs>
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F8F5"/>
      <stop offset="100%" style="stop-color:#F1F2EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-main)"/>

  <text x="400" y="48" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#1F6B50">California Housing MLOps — Illustrative Architecture</text>
  <text x="400" y="72" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#536158">Production ML pipeline: data ingestion, validation, feature engineering, model training, registry, serving, monitoring</text>

  <!-- Pipeline stages -->
  <g transform="translate(60, 110)">
    <rect width="145" height="100" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#1F6B50">Ingest</text>
    <text x="72" y="42" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Great Expectations</text>
    <text x="72" y="58" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Schema validation</text>
    <text x="72" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#D99A3D">✓ 20,640 rows</text>
  </g>

  <g transform="translate(235, 110)">
    <rect width="145" height="100" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#1F6B50">Transform</text>
    <text x="72" y="42" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Feature engineering</text>
    <text x="72" y="58" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">8 → 15 features</text>
    <text x="72" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#D99A3D">✓ Feature store</text>
  </g>

  <g transform="translate(410, 110)">
    <rect width="145" height="100" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#1F6B50">Train</text>
    <text x="72" y="42" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">XGBoost + Optuna</text>
    <text x="72" y="58" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">MLflow tracking</text>
    <text x="72" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#D99A3D">✓ R² 0.87</text>
  </g>

  <g transform="translate(585, 110)">
    <rect width="145" height="100" rx="10" fill="#FFFFFF" stroke="#DDE4DC" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#1F6B50">Serve</text>
    <text x="72" y="42" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">FastAPI + Uvicorn</text>
    <text x="72" y="58" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#536158">Docker / K8s ready</text>
    <text x="72" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#D99A3D">✓ 42ms p95</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(60, 260)">
    <rect width="680" height="100" rx="12" fill="#F1F2EE" stroke="#EBEDE8" stroke-width="1"/>
    <text x="340" y="28" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#17211B">Verified Project Metrics</text>
    <text x="110" y="55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B" font-weight="600">R² 0.87</text>
    <text x="250" y="55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B" font-weight="600">42ms p95</text>
    <text x="390" y="55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B" font-weight="600">3.2 min train</text>
    <text x="530" y="55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#17211B" font-weight="600">94% coverage</text>
    <text x="110" y="78" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Model accuracy (test set)</text>
    <text x="250" y="78" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">API latency (p95)</text>
    <text x="390" y="78" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Full pipeline (CPU)</text>
    <text x="530" y="78" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#536158">Unit + integration</text>
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8D9A94">Illustrative architecture summary — not a live production screenshot. Metrics from verified repository data.</text>
</svg>
