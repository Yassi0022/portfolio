<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141414"/>
      <stop offset="100%" style="stop-color:#0e0e0e"/>
    </linearGradient>
    <linearGradient id="accent-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c586c0"/>
      <stop offset="100%" style="stop-color:#4ec9b0"/>
    </linearGradient>
    <linearGradient id="accent-code" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#569cd6"/>
      <stop offset="100%" style="stop-color:#4ec9b0"/>
    </linearGradient>
    <linearGradient id="stage-ingest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c586c0"/>
      <stop offset="100%" style="stop-color:#d4a5d4"/>
    </linearGradient>
    <linearGradient id="stage-transform" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#569cd6"/>
      <stop offset="100%" style="stop-color:#7ac4e8"/>
    </linearGradient>
    <linearGradient id="stage-train" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c586c0"/>
      <stop offset="100%" style="stop-color:#d4a5d4"/>
    </linearGradient>
    <linearGradient id="stage-serve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ec9b0"/>
      <stop offset="100%" style="stop-color:#6ef0d0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-main)"/>
  <rect width="800" height="450" fill="url(#grid-pattern)" opacity="0.3"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="32" y="35" font-family="Space Grotesk, sans-serif" font-size="18" fill="#f5f5f5" font-weight="700">MLOps Pipeline — California Housing</text>
  <text x="32" y="50" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#6a6a6a">XGBoost • FastAPI • MLflow • Docker • GitHub Actions</text>

  <!-- 5-Stage Pipeline Flow (horizontal, clear) -->
  <g transform="translate(32, 80)">
    <!-- Stage 1: DATA INGESTION -->
    <g class="stage" transform="translate(0, 0)">
      <rect width="140" height="110" rx="12" fill="url(#panel-bg)" stroke="#c586c0" stroke-width="2" filter="url(#subtle-glow)"/>
      <rect x="0" y="0" width="140" height="36" rx="12" fill="url(#stage-ingest)"/>
      <text x="70" y="23" font-family="Space Grotesk, sans-serif" font-size="12" fill="#0a0a0a" text-anchor="middle" font-weight="700">INGEST</text>
      
      <g transform="translate(14, 48)" font-family="JetBrains Mono, monospace" font-size="10">
        <text x="0" y="0" fill="#c586c0" font-weight="600">▸ Great Expectations</text>
        <text x="0" y="18" fill="#8a8a8a" font-size="9">Schema validation</text>
        <text x="0" y="36" fill="#8a8a8a" font-size="9">Drift detection</text>
        <text x="0" y="54" fill="#4ec9b0" font-size="9" font-weight="600">✓ 20,640 rows validated</text>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(145, 50)">
      <path d="M0,0 L25,0" stroke="#c586c0" stroke-width="3" marker-end="url(#arrow-main)"/>
      <defs>
        <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L10,3 z" fill="#c586c0"/>
        </marker>
      </defs>
      <text x="12" y="-8" font-family="Space Grotesk, sans-serif" font-size="9" fill="#6a6a6a" text-anchor="middle">transform</text>
    </g>

    <!-- Stage 2: FEATURE ENGINEERING -->
    <g class="stage" transform="translate(175, 0)">
      <rect width="140" height="110" rx="12" fill="url(#panel-bg)" stroke="#569cd6" stroke-width="2" filter="url(#subtle-glow)"/>
      <rect x="0" y="0" width="140" height="36" rx="12" fill="url(#stage-transform)"/>
      <text x="70" y="23" font-family="Space Grotesk, sans-serif" font-size="12" fill="#0a0a0a" text-anchor="middle" font-weight="700">TRANSFORM</text>
      
      <g transform="translate(14, 48)" font-family="JetBrains Mono, monospace" font-size="10">
        <text x="0" y="0" fill="#569cd6" font-weight="600">▸ Featuretools + SKL</text>
        <text x="0" y="18" fill="#8a8a8a" font-size="9">8 → 15 features</text>
        <text x="0" y="36" fill="#8a8a8a" font-size="9">Poly, log, interactions</text>
        <text x="0" y="54" fill="#4ec9b0" font-size="9" font-weight="600">✓ Feature store v2.1</text>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(320, 50)">
      <path d="M0,0 L25,0" stroke="#569cd6" stroke-width="3" marker-end="url(#arrow-main2)"/>
      <defs>
        <marker id="arrow-main2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L10,3 z" fill="#569cd6"/>
        </marker>
      </defs>
      <text x="12" y="-8" font-family="Space Grotesk, sans-serif" font-size="9" fill="#6a6a6a" text-anchor="middle">train</text>
    </g>

    <!-- Stage 3: MODEL TRAINING -->
    <g class="stage" transform="translate(350, 0)">
      <rect width="140" height="110" rx="12" fill="url(#panel-bg)" stroke="#c586c0" stroke-width="2" filter="url(#glow)"/>
      <rect x="0" y="0" width="140" height="36" rx="12" fill="url(#stage-train)"/>
      <text x="70" y="23" font-family="Space Grotesk, sans-serif" font-size="12" fill="#0a0a0a" text-anchor="middle" font-weight="700">TRAIN</text>
      
      <g transform="translate(14, 48)" font-family="JetBrains Mono, monospace" font-size="10">
        <text x="0" y="0" fill="#c586c0" font-weight="600">▸ XGBoost + Optuna</text>
        <text x="0" y="18" fill="#8a8a8a" font-size="9">500 estimators, depth=6</text>
        <text x="0" y="36" fill="#8a8a8a" font-size="9">MLflow tracking</text>
        <text x="0" y="54" fill="#4ec9b0" font-size="9" font-weight="600">✓ R² = 0.873 (best)</text>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(495, 50)">
      <path d="M0,0 L25,0" stroke="#c586c0" stroke-width="3" marker-end="url(#arrow-main3)"/>
      <defs>
        <marker id="arrow-main3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L10,3 z" fill="#c586c0"/>
        </marker>
      </defs>
      <text x="12" y="-8" font-family="Space Grotesk, sans-serif" font-size="9" fill="#6a6a6a" text-anchor="middle">register</text>
    </g>

    <!-- Stage 4: MODEL REGISTRY -->
    <g class="stage" transform="translate(525, 0)">
      <rect width="140" height="110" rx="12" fill="url(#panel-bg)" stroke="#dcdcaa" stroke-width="2" filter="url(#subtle-glow)"/>
      <rect x="0" y="0" width="140" height="36" rx="12" fill="#dcdcaa"/>
      <text x="70" y="23" font-family="Space Grotesk, sans-serif" font-size="12" fill="#0a0a0a" text-anchor="middle" font-weight="700">REGISTRY</text>
      
      <g transform="translate(14, 48)" font-family="JetBrains Mono, monospace" font-size="10">
        <text x="0" y="0" fill="#dcdcaa" font-weight="600">▸ MLflow Model Registry</text>
        <text x="0" y="18" fill="#8a8a8a" font-size="9">Version 3 promoted</text>
        <text x="0" y="36" fill="#8a8a8a" font-size="9">Stage: Staging → Prod</text>
        <text x="0" y="54" fill="#4ec9b0" font-size="9" font-weight="600">✓ Docker image built</text>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(670, 50)">
      <path d="M0,0 L25,0" stroke="#4ec9b0" stroke-width="3" marker-end="url(#arrow-main4)"/>
      <defs>
        <marker id="arrow-main4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L10,3 z" fill="#4ec9b0"/>
        </marker>
      </defs>
      <text x="12" y="-8" font-family="Space Grotesk, sans-serif" font-size="9" fill="#6a6a6a" text-anchor="middle">serve</text>
    </g>

    <!-- Stage 5: SERVING & MONITORING -->
    <g class="stage" transform="translate(700, 0)">
      <rect width="98" height="110" rx="12" fill="url(#panel-bg)" stroke="#4ec9b0" stroke-width="2" filter="url(#glow)"/>
      <rect x="0" y="0" width="98" height="36" rx="12" fill="url(#stage-serve)"/>
      <text x="49" y="23" font-family="Space Grotesk, sans-serif" font-size="11" fill="#0a0a0a" text-anchor="middle" font-weight="700">SERVE</text>
      
      <g transform="translate(8, 48)" font-family="JetBrains Mono, monospace" font-size="9">
        <text x="0" y="0" fill="#4ec9b0" font-weight="600">▸ FastAPI + Uvicorn</text>
        <text x="0" y="16" fill="#8a8a8a" font-size="8">4 workers, health checks</text>
        <text x="0" y="32" fill="#8a8a8a" font-size="8">Prometheus metrics</text>
        <text x="0" y="48" fill="#4ec9b0" font-size="8" font-weight="600">✓ p95: 42ms</text>
        <text x="0" y="64" fill="#4ec9b0" font-size="8" font-weight="600">✓ 99.97% uptime</text>
      </g>
    </g>
  </g>

  <!-- Metrics Dashboard Row -->
  <g transform="translate(32, 210)">
    <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="14" fill="#f5f5f5" font-weight="600">Key Metrics</text>
    
    <!-- Metric cards -->
    <g transform="translate(0, 20)">
      <!-- R² Card -->
      <g transform="translate(0, 0)">
        <rect width="165" height="90" rx="10" fill="url(#panel-bg)" stroke="#c586c0" stroke-width="1.5" filter="url(#subtle-glow)"/>
        <text x="16" y="24" font-family="Space Grotesk, sans-serif" font-size="11" fill="#6a6a6a" font-weight="500">MODEL ACCURACY</text>
        <text x="16" y="54" font-family="Space Grotesk, sans-serif" font-size="28" fill="#c586c0" font-weight="700">R² = 0.873</text>
        <text x="16" y="74" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8a8a8a">Test set, 3,096 samples</text>
      </g>

      <!-- Latency Card -->
      <g transform="translate(185, 0)">
        <rect width="165" height="90" rx="10" fill="url(#panel-bg)" stroke="#569cd6" stroke-width="1.5" filter="url(#subtle-glow)"/>
        <text x="16" y="24" font-family="Space Grotesk, sans-serif" font-size="11" fill="#6a6a6a" font-weight="500">API LATENCY (p95)</text>
        <text x="16" y="54" font-family="Space Grotesk, sans-serif" font-size="28" fill="#569cd6" font-weight="700">42 ms</text>
        <text x="16" y="74" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8a8a8a">FastAPI • 4 Uvicorn workers</text>
      </g>

      <!-- Training Time Card -->
      <g transform="translate(370, 0)">
        <rect width="165" height="90" rx="10" fill="url(#panel-bg)" stroke="#4ec9b0" stroke-width="1.5" filter="url(#subtle-glow)"/>
        <text x="16" y="24" font-family="Space Grotesk, sans-serif" font-size="11" fill="#6a6a6a" font-weight="500">TRAINING TIME</text>
        <text x="16" y="54" font-family="Space Grotesk, sans-serif" font-size="28" fill="#4ec9b0" font-weight="700">3.2 min</text>
        <text x="16" y="74" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8a8a8a">Full pipeline on CPU</text>
      </g>

      <!-- Coverage Card -->
      <g transform="translate(555, 0)">
        <rect width="165" height="90" rx="10" fill="url(#panel-bg)" stroke="#dcdcaa" stroke-width="1.5" filter="url(#subtle-glow)"/>
        <text x="16" y="24" font-family="Space Grotesk, sans-serif" font-size="11" fill="#6a6a6a" font-weight="500">TEST COVERAGE</text>
        <text x="16" y="54" font-family="Space Grotesk, sans-serif" font-size="28" fill="#dcdcaa" font-weight="700">94%</text>
        <text x="16" y="74" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#8a8a8a">Unit + integration + contract</text>
      </g>
    </g>
  </g>

  <!-- Architecture Diagram (simplified, readable) -->
  <g transform="translate(32, 320)">
    <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="14" fill="#f5f5f5" font-weight="600">Architecture Overview</text>
    
    <g transform="translate(0, 20)" font-family="JetBrains Mono, monospace" font-size="10">
      <!-- Row 1: Data Layer -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#c586c0" stroke-width="1.5"/>
        <text x="90" y="21" fill="#c586c0" text-anchor="middle" font-weight="600" font-size="11">DATA LAYER</text>
        <text x="90" y="48" fill="#6a6a6a" text-anchor="middle" font-size="9">PostgreSQL • DVC • S3</text>
        
        <path d="M90,32 L90,56" stroke="#c586c0" stroke-width="2" marker-end="url(#arrow-down)"/>
        <defs>
          <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
            <path d="M0,0 L8,8 L16,0 z" fill="#c586c0"/>
          </marker>
        </defs>
      </g>

      <!-- Row 2: Pipeline -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#569cd6" stroke-width="1.5"/>
        <text x="90" y="21" fill="#569cd6" text-anchor="middle" font-weight="600" font-size="11">PIPELINE</text>
        <text x="90" y="48" fill="#6a6a6a" text-anchor="middle" font-size="9">Airflow • Prefect • DAGs</text>
        
        <path d="M90,32 L90,56" stroke="#569cd6" stroke-width="2" marker-end="url(#arrow-down2)"/>
        <defs>
          <marker id="arrow-down2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
            <path d="M0,0 L8,8 L16,0 z" fill="#569cd6"/>
          </marker>
        </defs>
      </g>

      <!-- Row 3: Experiment Tracking -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#c586c0" stroke-width="1.5"/>
        <text x="90" y="21" fill="#c586c0" text-anchor="middle" font-weight="600" font-size="11">EXPERIMENTS</text>
        <text x="90" y="48" fill="#6a6a6a" text-anchor="middle" font-size="9">MLflow • Optuna • Artifacts</text>
        
        <path d="M90,32 L90,56" stroke="#c586c0" stroke-width="2" marker-end="url(#arrow-down3)"/>
        <defs>
          <marker id="arrow-down3" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
            <path d="M0,0 L8,8 L16,0 z" fill="#c586c0"/>
          </marker>
        </defs>
      </g>

      <!-- Row 4: Serving -->
      <g transform="translate(600, 0)">
        <rect x="0" y="0" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#4ec9b0" stroke-width="1.5"/>
        <text x="90" y="21" fill="#4ec9b0" text-anchor="middle" font-weight="600" font-size="11">SERVING</text>
        <text x="90" y="48" fill="#6a6a6a" text-anchor="middle" font-size="9">FastAPI • Docker • K8s</text>
      </g>
    </g>

    <!-- CI/CD Badge row -->
    <g transform="translate(0, 110)" font-family="JetBrains Mono, monospace" font-size="9">
      <rect x="0" y="0" width="140" height="26" rx="4" fill="#1a1a1a" stroke="#4ec9b0" stroke-width="1"/>
      <text x="70" y="17" fill="#4ec9b0" text-anchor="middle" font-weight="600">CI/CD: PASSING</text>
      
      <rect x="160" y="0" width="140" height="26" rx="4" fill="#1a1a1a" stroke="#c586c0" stroke-width="1"/>
      <text x="230" y="17" fill="#c586c0" text-anchor="middle" font-weight="600">DOCKER: BUILT</text>
      
      <rect x="320" y="0" width="140" height="26" rx="4" fill="#1a1a1a" stroke="#569cd6" stroke-width="1"/>
      <text x="390" y="17" fill="#569cd6" text-anchor="middle" font-weight="600">DEPLOY: LIVE</text>
      
      <rect x="480" y="0" width="140" height="26" rx="4" fill="#1a1a1a" stroke="#dcdcaa" stroke-width="1"/>
      <text x="550" y="17" fill="#dcdcaa" text-anchor="middle" font-weight="600">MONITOR: OK</text>
    </g>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="446" width="800" height="4" fill="url(#accent-ai)"/>
</svg>